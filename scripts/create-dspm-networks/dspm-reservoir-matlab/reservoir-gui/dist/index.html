    <!-- MATLAB uihtml bridge -->
    <script>
      let htmlComponent = null;
      
      function setup(component) {
        console.log('MATLAB uihtml setup called!');
        htmlComponent = component;
        
        // Make it globally accessible for React
        window.matlabBridge = htmlComponent;
        
        // Listen for data FROM MATLAB
        htmlComponent.addEventListener('DataChanged', () => {
          const data = htmlComponent.Data;
          console.log('Data received from MATLAB:', data);
          
          // Dispatch custom event for React to catch
          window.dispatchEvent(new CustomEvent('matlabData', { 
            detail: data 
          }));
        });
        
        // Signal to MATLAB that we're ready
        htmlComponent.Data = { action: 'ready' };
      }
    </script>
  </body>
